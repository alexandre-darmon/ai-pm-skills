name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4  # regex graders are checked with JavaScript RegExp, as the harness runs them
        with:
          node-version: "22"
      - run: pip install pyyaml==6.0.2
      - run: python -m unittest discover -s scripts
      - run: python scripts/validate_skills.py
