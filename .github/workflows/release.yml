name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4  # regex graders are checked with JavaScript RegExp
        with:
          node-version: "22"
      - run: pip install pyyaml==6.0.2
      - run: python -m unittest discover -s scripts
      - run: python scripts/validate_skills.py
      - run: python scripts/check_generated.py
      - name: Tag matches the manifests' version
        run: |
          V=$(python -c "import json; print(json.load(open('.claude-plugin/marketplace.json'))['metadata']['version'])")
          if [ "v$V" != "$GITHUB_REF_NAME" ]; then echo "tag $GITHUB_REF_NAME but the manifests say $V: bump every manifest first"; exit 1; fi
      - name: Package
        run: |
          DATE=$(git log -1 --format=%cs "$GITHUB_REF_NAME")
          python scripts/package_skills.py --date "$DATE"  # writes dist/*.zip and dist/SHA256SUMS
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "AI PM Skills $GITHUB_REF_NAME" --verify-tag \
              $( [ -f "docs/releases/$GITHUB_REF_NAME.md" ] && echo --notes-file "docs/releases/$GITHUB_REF_NAME.md" || echo --generate-notes )
          gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS --clobber
