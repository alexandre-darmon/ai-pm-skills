name: evals

# Paid runs (PRD §11.5). On a PR: add the `run-evals` label; remove and re-add it to run again.
# PRs from forks get no secret, so they are not evaluated here.
on:
  pull_request:
    types: [labeled]
  schedule:
    - cron: "0 5 * * 1" # weekly, Monday 05:00 UTC
  workflow_dispatch:
    inputs:
      skills:
        description: "Skill folders, space-separated (empty: changed since main)"
        default: ""
      full:
        description: "Run with and without the skill (ignore stored baselines)"
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  group: evals-${{ github.ref }}

jobs:
  evals:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.label.name == 'run-evals' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code@2.1.302
      - run: pip install pyyaml==6.0.2
      - name: Run evals
        env:
          EVENT: ${{ github.event_name }}
          SKILLS: ${{ inputs.skills }}
          FULL: ${{ inputs.full }}
          BASE: ${{ github.base_ref }}
        run: |
          case "$EVENT" in
            schedule) python scripts/run_evals.py --full --all ;;
            workflow_dispatch) if [ "$FULL" = true ]; then FLAG=--full; fi; python scripts/run_evals.py $FLAG $SKILLS ;;
            *) python scripts/run_evals.py --base "origin/$BASE" ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-out
          path: eval-out/
          if-no-files-found: ignore
      - name: Open an issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh issue create --repo "$GITHUB_REPOSITORY"
          --title "Weekly evals failed ($(date +%F))"
          --body "A skill dropped below its threshold or no longer beats the model alone: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
