name: evals

# Paid runs, only on request (PRD §11.5). On a PR: add the `run-evals` label; remove and re-add it
# to run again. Full suite: run this workflow by hand with `all`. PRs from forks get no secret.
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      skills:
        description: "Skill folders, space-separated (empty: changed since main)"
        default: ""
      all:
        description: "Every skill in skills/ (after a major change: foundations, model, harness)"
        type: boolean
        default: false
      full:
        description: "Run with and without the skill (ignore stored baselines)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: evals-${{ github.ref }}

jobs:
  evals:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.label.name == 'run-evals' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code@2.1.302
      - run: pip install pyyaml==6.0.2
      - name: Run evals
        env:
          EVENT: ${{ github.event_name }}
          SKILLS: ${{ inputs.skills }}
          FULL: ${{ inputs.full }}
          ALL: ${{ inputs.all }}
          BASE: ${{ github.base_ref }}
        run: |
          case "$EVENT" in
            workflow_dispatch)
              FLAGS=""
              if [ "$FULL" = true ]; then FLAGS="$FLAGS --full"; fi
              if [ "$ALL" = true ]; then FLAGS="$FLAGS --all"; fi
              python scripts/run_evals.py $FLAGS $SKILLS ;;
            *) python scripts/run_evals.py --base "origin/$BASE" ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-out
          path: eval-out/
          if-no-files-found: ignore
